<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PT Intro Checklist</title></head><body><h1>LA Fitness PT Intro</h1><p>Couples training session</p><div id="app"></div><script>const tasks=['Introduction and goals','Safety check and warm-up','TRX Squats: 2 x 10','Kettlebell RDLs: 2 x 10','Seated Cable Rows: 2 x 12','Face Pulls: 2 x 12','Battle Ropes: 2 x 20 seconds','Discuss PT options'];document.getElementById('app').innerHTML=tasks.map((t,i)=>'<p><label><input type="checkbox" id="c'+i+'"> '+t+'</label></p>').join('');tasks.forEach((t,i)=>{const e=document.getElementById('c'+i);e.checked=localStorage.getItem('pt'+i)==='true';e.onchange=()=>localStorage.setItem('pt'+i,e.checked)});</script></body></html>
